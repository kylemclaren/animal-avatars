<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>animal-avatars hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=block" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #0E0C1A; }
    #hero {
      position: relative; width: 1280px; height: 640px; overflow: hidden;
      font-family: 'Fredoka', system-ui, sans-serif; color: #F6F2FF;
      background:
        radial-gradient(120% 90% at 50% 115%, #3A2A6B 0%, rgba(58,42,107,0) 60%),
        radial-gradient(70% 60% at 50% -10%, #2A2150 0%, rgba(42,33,80,0) 70%),
        linear-gradient(180deg, #15112A 0%, #0E0C1A 100%);
    }
    /* a scatter of tiny stars */
    #hero::before {
      content: ''; position: absolute; inset: 0; opacity: .55;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 18%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 17% 42%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 27% 9%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 38% 30%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 61% 12%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 72% 36%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 83% 8%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 93% 27%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 4% 58%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 97% 55%, #fff 50%, transparent 51%);
    }
    .title { position: absolute; top: 44px; left: 0; right: 0; text-align: center; }
    .title h1 { margin: 0; font-size: 72px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
    .title h1 span { background: linear-gradient(90deg, #FFB36B, #FF8FB1 35%, #B9A4FF 65%, #7FE08A); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .title p { margin: 12px 0 0; font-size: 23px; font-weight: 500; color: #BDB3DC; letter-spacing: .2px; }
    .facts { margin-top: 16px; display: inline-flex; align-items: center; gap: 12px; padding: 7px 18px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); font-size: 15px; font-weight: 500; color: #A99FCB; }
    .facts i { width: 4px; height: 4px; border-radius: 50%; background: #6E6494; }
    .stage { position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
    .char { position: relative; display: flex; flex-direction: column; align-items: center; }
    .glow { position: absolute; left: 50%; top: 50%; width: 120%; height: 120%; transform: translate(-50%, -52%); border-radius: 50%; filter: blur(34px); opacity: .38; }
    .floor { position: absolute; left: 50%; bottom: 22px; width: 62%; height: 18px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
    canvas { position: relative; display: block; }
    .name { position: relative; margin-top: -30px; font-size: 17px; font-weight: 600; color: #9D93C2; letter-spacing: .4px; }
    /* light: a pale lilac morning, the same stage */
    #hero[data-theme="light"] {
      color: #2A2145;
      background:
        radial-gradient(120% 90% at 50% 118%, #D9CCFF 0%, rgba(217,204,255,0) 62%),
        radial-gradient(70% 60% at 50% -10%, #FFFFFF 0%, rgba(255,255,255,0) 70%),
        linear-gradient(180deg, #FBF9FF 0%, #F1ECFD 100%);
    }
    #hero[data-theme="light"]::before {
      opacity: .7;
      background-image:
        radial-gradient(3px 3px at 8% 18%, #FFC59A 50%, transparent 51%),
        radial-gradient(2.5px 2.5px at 17% 42%, #C9B8FF 50%, transparent 51%),
        radial-gradient(3px 3px at 27% 9%, #FFB3C7 50%, transparent 51%),
        radial-gradient(2px 2px at 38% 30%, #A8E6B0 50%, transparent 51%),
        radial-gradient(2.5px 2.5px at 61% 12%, #FFC59A 50%, transparent 51%),
        radial-gradient(3px 3px at 72% 36%, #C9B8FF 50%, transparent 51%),
        radial-gradient(2px 2px at 83% 8%, #A8E6B0 50%, transparent 51%),
        radial-gradient(3px 3px at 93% 27%, #FFB3C7 50%, transparent 51%),
        radial-gradient(2px 2px at 4% 58%, #C9B8FF 50%, transparent 51%),
        radial-gradient(2.5px 2.5px at 97% 55%, #FFC59A 50%, transparent 51%);
    }
    #hero[data-theme="light"] .title h1 span { background-image: linear-gradient(90deg, #FF7A2E, #EE4F86 35%, #8363FF 65%, #2FB553); }
    #hero[data-theme="light"] .title p { color: #5E5387; }
    #hero[data-theme="light"] .facts { background: rgba(90,70,160,.06); border-color: rgba(90,70,160,.14); color: #6D6199; }
    #hero[data-theme="light"] .facts i { background: #B4A9D6; }
    #hero[data-theme="light"] .glow { opacity: .3; }
    #hero[data-theme="light"] .floor { background: radial-gradient(closest-side, rgba(70,50,130,.28), rgba(70,50,130,0)); }
    /* the pattern layout */
    .pattern { position: absolute; inset: 0; }
    .tile { position: absolute; display: block; }
    .veil { position: absolute; inset: 0; background: radial-gradient(60% 62% at 50% 50%, rgba(14,12,26,.62) 0%, rgba(14,12,26,.18) 70%, rgba(14,12,26,0) 100%); }
    #hero[data-theme="light"] .veil { background: radial-gradient(60% 62% at 50% 50%, rgba(247,244,255,.66) 0%, rgba(247,244,255,.2) 70%, rgba(247,244,255,0) 100%); }
    .plate {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 38px 56px 36px; border-radius: 40px; text-align: center; white-space: nowrap;
      background: rgba(21,17,42,.78); border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    #hero[data-theme="light"] .plate { background: rgba(252,250,255,.84); border-color: rgba(90,70,160,.14); box-shadow: 0 24px 60px rgba(70,50,130,.18), inset 0 1px 0 #fff; }
    .plate h1 { margin: 0; font-size: 72px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
    .plate h1 span { background: linear-gradient(90deg, #FFB36B, #FF8FB1 35%, #B9A4FF 65%, #7FE08A); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #hero[data-theme="light"] .plate h1 span { background-image: linear-gradient(90deg, #FF7A2E, #EE4F86 35%, #8363FF 65%, #2FB553); }
    .plate p { margin: 12px 0 0; font-size: 23px; font-weight: 500; color: #BDB3DC; }
    #hero[data-theme="light"] .plate p { color: #5E5387; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./hero.tsx"></script>
</body>
</html>
