<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>animal-avatars hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=block" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #0E0C1A; }
    #hero {
      position: relative; width: 1280px; height: 640px; overflow: hidden;
      font-family: 'Fredoka', system-ui, sans-serif; color: #F6F2FF;
      background:
        radial-gradient(120% 90% at 50% 115%, #3A2A6B 0%, rgba(58,42,107,0) 60%),
        radial-gradient(70% 60% at 50% -10%, #2A2150 0%, rgba(42,33,80,0) 70%),
        linear-gradient(180deg, #15112A 0%, #0E0C1A 100%);
    }
    /* a scatter of tiny stars */
    #hero::before {
      content: ''; position: absolute; inset: 0; opacity: .55;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 18%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 17% 42%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 27% 9%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 38% 30%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 61% 12%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 72% 36%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 83% 8%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 93% 27%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 4% 58%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 97% 55%, #fff 50%, transparent 51%);
    }
    .title { position: absolute; top: 44px; left: 0; right: 0; text-align: center; }
    .title h1 { margin: 0; font-size: 72px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
    .title h1 span { background: linear-gradient(90deg, #FFB36B, #FF8FB1 35%, #B9A4FF 65%, #7FE08A); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .title p { margin: 12px 0 0; font-size: 23px; font-weight: 500; color: #BDB3DC; letter-spacing: .2px; }
    .facts { margin-top: 16px; display: inline-flex; align-items: center; gap: 12px; padding: 7px 18px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); font-size: 15px; font-weight: 500; color: #A99FCB; }
    .facts i { width: 4px; height: 4px; border-radius: 50%; background: #6E6494; }
    .stage { position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
    .char { position: relative; display: flex; flex-direction: column; align-items: center; }
    .glow { position: absolute; left: 50%; top: 50%; width: 120%; height: 120%; transform: translate(-50%, -52%); border-radius: 50%; filter: blur(34px); opacity: .38; }
    .floor { position: absolute; left: 50%; bottom: 22px; width: 62%; height: 18px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
    canvas { position: relative; display: block; }
    .name { position: relative; margin-top: -30px; font-size: 17px; font-weight: 600; color: #9D93C2; letter-spacing: .4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./hero.tsx"></script>
</body>
</html>
